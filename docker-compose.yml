name: mrstore_webhost
services:
  webhost:
    build: .
    image: mrstore_webhost:local
    container_name: mrstore_webhost-panel
    user: "${WEBHOST_UID:-1000}:${WEBHOST_GID:-1000}"
    restart: unless-stopped
    ports:
      # Default local-only access. Set WEBHOST_PANEL_BIND_IP to a LAN interface consciously.
      - "${WEBHOST_PANEL_BIND_IP:-127.0.0.1}:8484:8484"
    environment:
      ADMIN_PASSWORD: ${WEBHOST_ADMIN_PASSWORD:?Define_WEBHOST_ADMIN_PASSWORD}
      HOST_DATA_DIR: ${WEBHOST_DATA_DIR:-/DATA/AppData/MrStore_webhost/data}
      SITE_BIND_IP: ${WEBHOST_SITE_BIND_IP:-127.0.0.1}
      PORT: "8484"
      DOCKER_HOST: "unix:///run/mrstore/docker.sock"
      HEALTH_ATTEMPTS: "20"
    volumes:
      # Must be the socket of a DEDICATED ROOTLESS Docker daemon.
      - ${WEBHOST_ROOTLESS_SOCKET:?Set_WEBHOST_ROOTLESS_SOCKET}:/run/mrstore/docker.sock
      - ${WEBHOST_DATA_DIR:-/DATA/AppData/MrStore_webhost/data}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
x-casaos:
  id: com.local.mrstore_webhost
  main: webhost
  index: /
  port_map: "8484"
  scheme: http
  title:
    en_US: MrStore_webhost
    pt_PT: MrStore_webhost
  tagline:
    en_US: Manage HTML, PHP, React and Node websites
    pt_PT: Gere websites HTML, PHP, React e Node
  category: Developer
  version: "0.4.0"
  architectures:
    - amd64
    - arm64
