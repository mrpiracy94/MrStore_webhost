name: CI and container release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Python and JavaScript syntax
        run: |
          python -m py_compile app/server.py
          node --check examples/node/server.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('app/index.html').read_text()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>', html)
          for script in scripts:
              subprocess.run(['node', '--check'], input=script, text=True, check=True)
          PY
  integration:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build local integration image
        run: docker build --pull -t mrstore_webhost:ci .
          docker pull docker:27-dind-rootless
      - name: Execute real Docker integration smoke tests
        run: python scripts/integration_smoke.py
  image:
    if: github.event_name != 'pull_request'
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mrpiracy94/mrstore_webhost:0.4.0
