# Copiar primeiro a pasta app/ deste pacote para /DATA/AppData/MrStore_webhost/app/
# ALTERAR ADMIN_PASSWORD antes de importar no ZimaOS.
name: mrstore_webhost
services:
  webhost:
    image: python:3.12-alpine
    container_name: mrstore_webhost-panel
    restart: unless-stopped
    command: ["sh", "-c", "apk add --no-cache docker-cli && exec python /app/server.py"]
    ports:
      - "8484:8484"
    environment:
      ADMIN_PASSWORD: "ALTERAR_PARA_PASSWORD_SEGURA_DE_12_CARACTERES"
      HOST_DATA_DIR: "/DATA/AppData/MrStore_webhost/data"
      PORT: "8484"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /DATA/AppData/MrStore_webhost/app:/app:ro
      - /DATA/AppData/MrStore_webhost/data:/data
x-casaos:
  id: com.local.mrstore_webhost
  main: webhost
  index: /
  port_map: "8484"
  scheme: http
  title:
    en_US: MrStore_webhost
    pt_PT: MrStore_webhost
  tagline:
    en_US: Manage HTML, PHP, React and Node websites
  category: Developer
  architectures:
    - amd64
    - arm64
  version: "0.2.0"