# Prebuilt Docker CLI image: available only after the GitHub Actions publish job succeeds.
# Before importing, change ADMIN_PASSWORD to a unique secret, and confirm /DATA path.
# The panel and sites are LAN-accessible: never expose these ports to the Internet.
# Requires a separate Docker rootless daemon on the ZimaOS host: see docs/ROOTLESS_SETUP.md.
name: mrstore_webhost
services:
  webhost:
    image: ghcr.io/mrpiracy94/mrstore_webhost:0.4.0
    container_name: mrstore_webhost-panel
    # Change to the UID/GID of the dedicated rootless Docker owner.
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      ADMIN_PASSWORD: "ALTERAR_PARA_PASSWORD_SEGURA_DE_12_CARACTERES"
      HOST_DATA_DIR: "/DATA/AppData/MrStore_webhost/data"
      SITE_BIND_IP: "0.0.0.0"
      PORT: "8484"
      DOCKER_HOST: "unix:///run/mrstore/docker.sock"
      HEALTH_ATTEMPTS: "20"
    volumes:
      # Only configure this after verifying that the user 1000 daemon is rootless.
      # Replace 1000 with the dedicated user's real UID.
      - /run/user/1000/docker.sock:/run/mrstore/docker.sock
      - /DATA/AppData/MrStore_webhost/data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
x-casaos:
  id: com.local.mrstore_webhost
  main: webhost
  index: /
  port_map: "8484"
  scheme: http
  title:
    en_US: MrStore_webhost
    pt_PT: MrStore_webhost
  tagline:
    en_US: Manage HTML, PHP, React and Node websites
    pt_PT: Gere websites HTML, PHP, React e Node
  category: Developer
  architectures:
    - amd64
    - arm64
  version: "0.4.0"
